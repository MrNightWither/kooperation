<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kooperationen NightWither</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src https://firestore.googleapis.com https://nwu-anmeldung.nwu-brand.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="description" content="Kooperationen und Partner von NightWither Unity">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @font-face { font-family: 'Rajdhani'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/rajdhani-500.woff') format('woff'); }
  @font-face { font-family: 'Rajdhani'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/rajdhani-700.woff') format('woff'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/inter-400.woff') format('woff'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/inter-500.woff') format('woff'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/inter-600.woff') format('woff'); }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0d; --surface: #111116; --card: #16161b;
    --border: rgba(255,255,255,0.07); --gold: #c9a84c;
    --gold-dim: rgba(201,168,76,0.12); --text: #e8e8e8; --muted: #555;
  }
  body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(10,10,13,0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-logo { width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(201,168,76,0.3)); }
  .header-sub { font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); font-family: monospace; }
  .header-title { font-family: Rajdhani, sans-serif; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; }
  .header-back { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); text-decoration: none; font-family: monospace; transition: color 0.2s; }
  .header-back:hover { color: var(--gold); }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px 60px; display: flex; flex-direction: column; gap: 24px; }
  .section-label { font-size: 9px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 6px; height: 18px; border-radius: 3px; background: var(--gold); }
  .block { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .partner-card { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; transition: border-color 0.2s; }
  .partner-card:hover { border-color: rgba(201,168,76,0.3); }
  .partner-icon { width: 40px; height: 40px; border-radius: 10px; overflow: hidden; flex-shrink: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
  .partner-icon img { width: 100%; height: 100%; object-fit: cover; }
  .partner-name { font-family: Rajdhani, sans-serif; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.06em; text-transform: uppercase; }
  .partner-cat { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .partner-link { margin-left: auto; font-size: 0.7rem; color: var(--gold); text-decoration: none; opacity: 0.7; transition: opacity 0.2s; }
  .partner-link:hover { opacity: 1; }
  .empty-box { text-align: center; padding: 32px; border: 1px dashed rgba(255,255,255,0.07); border-radius: 12px; color: var(--muted); font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; }
  .spinner { width: 20px; height: 20px; border: 2px solid rgba(201,168,76,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .form-card input, .form-card textarea {
    width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; font-size: 0.85rem; color: var(--text);
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; outline: none; transition: border-color 0.2s; resize: none;
  }
  .form-card input::placeholder, .form-card textarea::placeholder { color: var(--muted); }
  .form-card input:focus, .form-card textarea:focus { border-color: rgba(201,168,76,0.4); }
  .btn { width: 100%; padding: 14px; background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.4); border-radius: 10px; color: var(--gold); font-family: Rajdhani, sans-serif; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
  .btn:hover { background: rgba(201,168,76,0.2); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg-error { font-size: 0.75rem; color: #f87171; text-align: center; display: none; }
  .msg-success { font-size: 0.75rem; color: #4ade80; text-align: center; display: none; }
  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; }
  .stat-num { font-family: Rajdhani, sans-serif; font-weight: 700; font-size: 1.4rem; color: var(--gold); }
  .stat-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);} }
  .fade { animation: fadeUp 0.4s ease both; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .form-card .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 0.72rem; color: #888; line-height: 1.5; cursor: pointer; }
  .form-card .consent input { width: auto; margin-top: 3px; accent-color: var(--gold); flex-shrink: 0; }
  .form-card .consent a { color: var(--gold); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button:focus-visible, a:focus-visible, .form-card input:focus-visible, .form-card textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>




<header>
  <div class="header-left">
    <img class="header-logo" src="logo.webp" alt="NightWither">
    <div>
      <div class="header-sub">NightWither Unity</div>
      <div class="header-title">Kooperationen</div>
    </div>
  </div>
  <a class="header-back" href="https://nightwither.de">← Zurück</a>
</header>

<main>

  <div style="display:flex;flex-direction:column;gap:12px" class="fade">
    <div class="section-label"><span class="dot"></span>Aktive Partner</div>
    <div class="block" id="partnerBlock">
      <div id="partnerLoading" style="text-align:center;padding:20px">
        <div class="spinner"></div>
        <span style="font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);font-family:monospace">Lade Partner...</span>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px" class="fade">
    <div class="section-label"><span class="dot"></span>Anfrage stellen</div>
    <div class="block form-card" style="gap:12px">
      <label class="sr-only" for="bizName">Name oder Unternehmen</label>
      <input id="bizName" type="text" placeholder="Name / Unternehmen" maxlength="80" autocomplete="organization">
      <label class="sr-only" for="bizEmail">E Mail Adresse</label>
      <input id="bizEmail" type="email" placeholder="E Mail Adresse" maxlength="120" autocomplete="email">
      <label class="sr-only" for="bizMsg">Deine Kooperationsidee</label>
      <textarea id="bizMsg" rows="5" placeholder="Deine Kooperationsidee..." maxlength="2000"></textarea>
      <div class="hp" aria-hidden="true"><label for="bizWebsite">Webseite</label><input id="bizWebsite" type="text" tabindex="-1" autocomplete="off"></div>
      <label class="consent"><input id="bizConsent" type="checkbox"><span>Ich bin einverstanden, dass meine Angaben zur Bearbeitung der Anfrage an den Discord Server von NightWither Unity übermittelt werden. Mehr dazu in der <a href="https://datenschutz.nightwither.de" target="_blank" rel="noopener noreferrer">Datenschutzerklärung</a>.</span></label>
      <p id="bizError" class="msg-error" role="alert">Bitte alle Felder ausfüllen.</p>
      <p id="bizSuccess" class="msg-success" role="status">✅ Anfrage gesendet! Wir melden uns.</p>
      <button id="bizSendBtn" class="btn" type="button">Anfrage senden</button>
    </div>
  </div>

  <div class="stats fade">
    <div class="stat"><div class="stat-num">645+</div><div class="stat-label">TikTok</div></div>
    <div class="stat"><div class="stat-num">55+</div><div class="stat-label">Twitch</div></div>
    <div class="stat"><div class="stat-num">∞</div><div class="stat-label">Schatten</div></div>
  </div>

</main>

<script src="kooperation.js"></script>
</body>
</html>
